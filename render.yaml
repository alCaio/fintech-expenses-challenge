databases:
  - name: fintech-db
    plan: free
    databaseName: fintech
    user: fintech

services:
  - type: web
    name: fintech-expenses
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend && npm run build --prefix backend
    startCommand: cd backend && npm run db:deploy && npm run db:seed && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: fintech-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
